name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check
      - run: nix develop -c make check
      - run: nix develop -c make check-nix

  # Runs the update action on this repository's own flake, whose targets are
  # its dev shells.
  update-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: ./update
        id: update
      - name: Show the report
        env:
          AFFECTED: ${{ steps.update.outputs.affected }}
          BODY_PATH: ${{ steps.update.outputs.body-path }}
        run: |
          echo "Affected: $AFFECTED"
          if [ -n "$BODY_PATH" ]; then cat "$BODY_PATH"; fi
